name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts — compile, test, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile --workspace contracts
      - run: npm test --workspace contracts

      # Cheap findings before paying an auditor to find them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install slither-analyzer
      - name: Slither
        working-directory: contracts
        # --fail-medium means "medium and above" (the two fail flags are
        # mutually exclusive). Informational and low detectors are excluded
        # deliberately: `timestamp` fires on every comparison in a lottery
        # measured in days, where a miner's few seconds of leeway is irrelevant.
        # Genuine false positives are annotated inline with slither-disable and
        # a justification, rather than being silenced globally here.
        run: >
          slither . --exclude-dependencies
          --filter-paths "node_modules|contracts/mocks"
          --exclude-informational --exclude-low --fail-medium

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint --workspace web
      - run: npm run build --workspace web
        env:
          NEXT_PUBLIC_CHAIN_ID: "31337"
